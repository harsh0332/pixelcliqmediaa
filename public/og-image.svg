<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="100%" stop-color="#EFEBE3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C4BFF" />
      <stop offset="100%" stop-color="#5472FF" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DDD3" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#14151A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Frame Border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5" />

  <!-- Top Header Bar inside Frame -->
  <g transform="translate(72, 72)">
    <!-- Logo Monogram -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#14151A" />
    <path d="M 14 16 H 34 V 24 H 14 Z M 14 24 H 26 V 34 H 14 Z" fill="#2C4BFF" />
    <circle cx="31" cy="31" r="3.5" fill="#FFFFFF" />

    <!-- Wordmark -->
    <text x="64" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#14151A" letter-spacing="-0.02em">Pixelcliq<tspan fill="#2C4BFF">.</tspan>Media</text>

    <!-- Eyebrow Pill -->
    <rect x="760" y="4" width="296" height="40" rx="20" fill="#EAEDFF" stroke="#2C4BFF" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="780" cy="24" r="4" fill="#2C4BFF" />
    <text x="794" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2C4BFF" letter-spacing="0.08em">D2C GROWTH ARCHITECTURE</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(72, 185)">
    <!-- Accent Line -->
    <rect x="0" y="0" width="80" height="5" rx="2.5" fill="url(#accentGrad)" />

    <!-- Main H1 -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#14151A" letter-spacing="-0.03em">
      Where D2C Brands
    </text>
    <text x="0" y="145" font-family="Georgia, serif" font-style="italic" font-size="68" font-weight="400" fill="#2C4BFF" letter-spacing="-0.02em">
      Compound<tspan font-family="system-ui, sans-serif" font-style="normal" font-weight="800" fill="#14151A">.</tspan>
    </text>

    <!-- Support Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#54555B" letter-spacing="-0.01em">
      The complete growth system behind scale — Creative, Paid Media, Shopify,
    </text>
    <text x="0" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#54555B" letter-spacing="-0.01em">
      Retention and Automation, executed as one unified loop.
    </text>
  </g>

  <!-- Bottom Capability Matrix Strip -->
  <g transform="translate(72, 500)">
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#E2DDD3" stroke-width="1.5" />

    <g transform="translate(0, 26)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#14151A" letter-spacing="0.1em">CAPABILITIES</text>
      <text x="130" y="16" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#54555B">Performance Creative</text>
      <circle cx="310" cy="12" r="3" fill="#2C4BFF" />
      <text x="330" y="16" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#54555B">Meta &amp; Google Ads</text>
      <circle cx="500" cy="12" r="3" fill="#2C4BFF" />
      <text x="520" y="16" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#54555B">Shopify &amp; CRO</text>
      <circle cx="660" cy="12" r="3" fill="#2C4BFF" />
      <text x="680" y="16" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#54555B">Retention &amp; AI</text>
    </g>

    <text x="1056" y="42" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#14151A" letter-spacing="0.04em">Indore · India · Global</text>
  </g>
</svg>
