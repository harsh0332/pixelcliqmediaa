<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Weekly sales climbing</title>
<desc id="d">Weekly sales bars grow one after another, the last bar shoots up, the sales figure climbs and a growth badge appears.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s cubic-bezier(.3,1.3,.5,1) infinite;animation-fill-mode:backwards}
.trend{stroke-dasharray:600;animation:trend 9s ease-in-out infinite}
.n1{animation:n1 9s steps(1,end) infinite}.n2{animation:n2 9s steps(1,end) infinite}.n3{animation:n3 9s steps(1,end) infinite}
.chip{animation:chip 9s ease-out infinite}
.sp{animation:sp 9s ease-out infinite}
@keyframes grow{0%{transform:scaleY(0)}12%{transform:scaleY(1)}88%{transform:scaleY(1)}95%,100%{transform:scaleY(0)}}
@keyframes trend{0%,16%{opacity:1;stroke-dashoffset:600}46%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}93%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes n1{0%{opacity:1}26%{opacity:0}96%{opacity:1}}
@keyframes n2{0%{opacity:0}26%{opacity:1}40%{opacity:0}}
@keyframes n3{0%{opacity:0}40%{opacity:1}96%{opacity:0}}
@keyframes chip{0%,40%{opacity:0;transform:translateY(8px)}44%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}93%,100%{opacity:0;transform:translateY(0)}}
@keyframes sp{0%,32%{opacity:0;transform:translate(0,0)}35%{opacity:1;transform:translate(0,0)}52%,100%{opacity:0;transform:translate(var(--x),var(--y))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="60" y="40" width="680" height="440" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="96" y="92" font-size="15" fill="#6B7189">Weekly sales</text>
<text class="f n1" x="96" y="150" font-size="48" font-weight="600" fill="#1C2140" opacity="0">₹48,200</text>
<text class="f n2" x="96" y="150" font-size="48" font-weight="600" fill="#1C2140" opacity="0">₹1,26,400</text>
<text class="f n3" x="96" y="150" font-size="48" font-weight="600" fill="#1C2140">₹3,84,900</text>
<g class="chip"><rect x="96" y="166" width="80" height="30" rx="15" fill="#FFC83D"/><text class="f" x="136" y="186" font-size="14" font-weight="600" fill="#1C2140" text-anchor="middle">+212%</text></g>
<g stroke="#EFEDE7" stroke-width="1"><line x1="96" y1="250" x2="704" y2="250"/><line x1="96" y1="320" x2="704" y2="320"/><line x1="96" y1="390" x2="704" y2="390"/><line x1="96" y1="430" x2="704" y2="430"/></g>
<rect class="bar" x="110" y="380" width="48" height="50" rx="8" fill="#D6DDFF"/>
<rect class="bar" x="198" y="360" width="48" height="70" rx="8" fill="#D6DDFF" style="animation-delay:.25s"/>
<rect class="bar" x="286" y="368" width="48" height="62" rx="8" fill="#D6DDFF" style="animation-delay:.5s"/>
<rect class="bar" x="374" y="330" width="48" height="100" rx="8" fill="#D6DDFF" style="animation-delay:.75s"/>
<rect class="bar" x="462" y="295" width="48" height="135" rx="8" fill="#AEBBFF" style="animation-delay:1s"/>
<rect class="bar" x="550" y="245" width="48" height="185" rx="8" fill="#7C8FFF" style="animation-delay:1.25s"/>
<rect class="bar" x="638" y="170" width="48" height="260" rx="8" fill="#3452FF" style="animation-delay:1.5s"/>
<polyline class="trend" points="134,372 222,352 310,360 398,322 486,287 574,237 662,162" fill="none" stroke="#1C2140" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect class="sp" x="657" y="150" width="10" height="10" fill="#FFC83D" opacity="0" style="--x:-40px;--y:-60px"/><rect class="sp" x="657" y="150" width="8" height="8" fill="#3452FF" opacity="0" style="--x:0px;--y:-80px"/><rect class="sp" x="657" y="150" width="10" height="10" fill="#FFC83D" opacity="0" style="--x:38px;--y:-55px"/><rect class="sp" x="657" y="150" width="6" height="6" fill="#1C2140" opacity="0" style="--x:-18px;--y:-95px"/><rect class="sp" x="657" y="150" width="8" height="8" fill="#FFC83D" opacity="0" style="--x:24px;--y:-100px"/></g>
<g class="f" font-size="13" fill="#6B7189" text-anchor="middle"><text x="134" y="458">W1</text><text x="222" y="458">W2</text><text x="310" y="458">W3</text><text x="398" y="458">W4</text><text x="486" y="458">W5</text><text x="574" y="458">W6</text><text x="662" y="458">W7</text></g>
<style>*{animation-play-state:paused!important;animation-delay:-4s!important}</style></svg>
