<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Pixelcliq Media: from ad click to order to revenue</title>
<desc id="d">A pixel cursor clicks Shop now on a product ad, pixels fly into the orders counter which ticks up by one, and a revenue line climbs.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.cur{animation:cur 9s ease-in-out infinite}
.btn{transform-box:fill-box;transform-origin:center;animation:btn 9s ease-in-out infinite}
.px{animation:px 9s cubic-bezier(.5,0,.3,1) infinite}
.n1{animation:n1 9s steps(1,end) infinite}
.n2{animation:n2 9s steps(1,end) infinite}
.cart{transform-box:fill-box;transform-origin:center;animation:cart 9s ease-out infinite}
.chip{animation:chip 9s ease-out infinite}
.line{stroke-dasharray:300;animation:line 9s ease-in-out infinite}
.area{animation:area 9s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 9s ease-out infinite}
@keyframes cur{0%{opacity:0;transform:translate(390px,470px) scale(1)}5%{opacity:1;transform:translate(390px,470px) scale(1)}18%{transform:translate(205px,405px) scale(1)}20%{transform:translate(205px,405px) scale(.8)}23%{transform:translate(205px,405px) scale(1)}31%{opacity:1;transform:translate(205px,405px) scale(1)}40%,100%{opacity:0;transform:translate(400px,480px) scale(1)}}
@keyframes btn{0%,19%{fill:#3452FF;transform:scale(1)}20%{fill:#2036D8;transform:scale(.96)}24%,100%{fill:#3452FF;transform:scale(1)}}
@keyframes px{0%,21%{opacity:0;transform:translate(0,0)}23%{opacity:1}29%{transform:translate(var(--sx),var(--sy))}40%{opacity:1;transform:translate(500px,-296px)}43%,100%{opacity:0;transform:translate(500px,-296px)}}
@keyframes n1{0%{opacity:1}41%{opacity:0}97%{opacity:1}}
@keyframes n2{0%{opacity:0}41%{opacity:1}97%{opacity:0}}
@keyframes cart{0%,39%{transform:scale(1)}43%{transform:scale(1.18)}48%,100%{transform:scale(1)}}
@keyframes chip{0%,41%{opacity:0;transform:translateY(8px)}45%{opacity:1;transform:translateY(0)}70%{opacity:1;transform:translateY(0)}76%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes line{0%,44%{opacity:1;stroke-dashoffset:300}70%{opacity:1;stroke-dashoffset:0}92%{opacity:1;stroke-dashoffset:0}97%{opacity:0;stroke-dashoffset:0}98%{opacity:0;stroke-dashoffset:300}100%{opacity:1;stroke-dashoffset:300}}
@keyframes area{0%,58%{opacity:0}72%,92%{opacity:.85}97%,100%{opacity:0}}
@keyframes dot{0%,67%{opacity:0;transform:scale(.4)}71%{opacity:1;transform:scale(1.35)}75%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="60" y="60" width="260" height="400" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<rect x="80" y="80" width="220" height="200" rx="16" fill="#E8ECFF"/>
<rect x="172" y="110" width="36" height="24" rx="6" fill="#1C2140"/>
<rect x="160" y="130" width="60" height="120" rx="14" fill="#3452FF"/>
<rect x="170" y="175" width="40" height="36" rx="4" fill="#FFC83D"/>
<g fill="#FFC83D"><rect x="112" y="118" width="8" height="8"/><rect x="250" y="150" width="6" height="6"/><rect x="118" y="220" width="6" height="6"/><rect x="258" y="236" width="8" height="8"/></g>
<rect x="80" y="300" width="150" height="12" rx="6" fill="#1C2140"/>
<rect x="80" y="322" width="100" height="10" rx="5" fill="#C9CCD8"/>
<text class="f" x="80" y="366" font-size="22" font-weight="600" fill="#1C2140">₹499</text>
<rect class="btn" x="80" y="385" width="220" height="52" rx="26" fill="#3452FF"/>
<text class="f" x="190" y="417" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Shop now</text>

<rect x="470" y="60" width="270" height="130" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="494" y="98" font-size="15" fill="#6B7189">Orders today</text>
<text class="f n1" x="494" y="162" font-size="46" font-weight="600" fill="#1C2140">128</text>
<text class="f n2" x="494" y="162" font-size="46" font-weight="600" fill="#1C2140" opacity="0">129</text>
<g class="chip" opacity="0"><rect x="600" y="136" width="40" height="24" rx="12" fill="#FFC83D"/><text class="f" x="620" y="153" font-size="13" font-weight="600" fill="#1C2140" text-anchor="middle">+1</text></g>
<g class="cart"><circle cx="690" cy="112" r="28" fill="#E8ECFF"/><path d="M675 101h6l5 17h17l4-13h-23" fill="none" stroke="#3452FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="689" cy="124" r="2.6" fill="#3452FF"/><circle cx="701" cy="124" r="2.6" fill="#3452FF"/></g>

<rect x="470" y="220" width="270" height="240" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="494" y="258" font-size="15" fill="#6B7189">Revenue this week</text>
<g stroke="#EFEDE7" stroke-width="1"><line x1="494" y1="300" x2="716" y2="300"/><line x1="494" y1="350" x2="716" y2="350"/><line x1="494" y1="400" x2="716" y2="400"/></g>
<polygon class="area" points="494,420 540,405 580,410 620,370 660,350 700,300 716,282 716,430 494,430" fill="#E8ECFF" opacity=".85"/>
<polyline class="line" points="494,420 540,405 580,410 620,370 660,350 700,300 716,282" fill="none" stroke="#3452FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="dot" cx="716" cy="282" r="7" fill="#FFC83D" stroke="#1C2140" stroke-width="2"/>

<g>
<rect class="px" x="185" y="406" width="10" height="10" fill="#3452FF" opacity="0" style="--sx:-40px;--sy:-60px"/>
<rect class="px" x="185" y="406" width="10" height="10" fill="#FFC83D" opacity="0" style="--sx:30px;--sy:-95px;animation-delay:.08s"/>
<rect class="px" x="185" y="406" width="10" height="10" fill="#1C2140" opacity="0" style="--sx:85px;--sy:-40px;animation-delay:.16s"/>
<rect class="px" x="185" y="406" width="10" height="10" fill="#3452FF" opacity="0" style="--sx:-10px;--sy:-125px;animation-delay:.24s"/>
<rect class="px" x="185" y="406" width="10" height="10" fill="#FFC83D" opacity="0" style="--sx:60px;--sy:-135px;animation-delay:.32s"/>
<rect class="px" x="185" y="406" width="10" height="10" fill="#3452FF" opacity="0" style="--sx:115px;--sy:-80px;animation-delay:.4s"/>
</g>

<g class="cur" transform="translate(205 405)">
<g fill="#1C2140"><rect x="0" y="0" width="5" height="5"/><rect x="0" y="5" width="10" height="5"/><rect x="0" y="10" width="15" height="5"/><rect x="0" y="15" width="20" height="5"/><rect x="0" y="20" width="25" height="5"/><rect x="0" y="25" width="30" height="5"/><rect x="0" y="30" width="35" height="5"/><rect x="0" y="35" width="20" height="5"/><rect x="0" y="40" width="5" height="5"/><rect x="15" y="40" width="10" height="5"/><rect x="20" y="45" width="10" height="5"/></g>
<g fill="#FFFFFF"><rect x="5" y="15" width="5" height="5"/><rect x="5" y="25" width="10" height="5"/></g>
</g>
<style>*{animation-play-state:paused!important;animation-delay:-4s!important}</style></svg>
