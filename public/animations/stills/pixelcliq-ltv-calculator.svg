<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">LTV calculation</title>
<desc id="d">Lifetime value is calculated as order value 650 rupees times 3.2 orders a year times 2 years times 60 percent margin, giving 2,496 rupees and a max CAC of 832. With retention, orders per year rise to 4.5, LTV becomes 3,510 and max CAC rises to 1,170.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.tv0{animation:tv0 14s ease-out infinite}@keyframes tv0{0%,4%{opacity:0;transform:translate(0px,6px)}7%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.tv2{animation:tv2 14s ease-out infinite}@keyframes tv2{0%,16%{opacity:0;transform:translate(0px,6px)}19%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.tv3{animation:tv3 14s ease-out infinite}@keyframes tv3{0%,22%{opacity:0;transform:translate(0px,6px)}25%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.op0{animation:op0 14s steps(1,end) infinite}@keyframes op0{0%{opacity:1}58%{opacity:0}95%{opacity:1}}
.op1{animation:op1 14s steps(1,end) infinite}@keyframes op1{0%{opacity:0}58%{opacity:1}95%{opacity:0}}
.hl{animation:hl 14s ease-out infinite}@keyframes hl{0%,55%{opacity:0}58%,93%{opacity:1}97%,100%{opacity:0}}
.lt0{animation:lt0 14s steps(1,end) infinite}@keyframes lt0{0%{opacity:1}30%{opacity:0}95%{opacity:1}}
.lt1{animation:lt1 14s steps(1,end) infinite}@keyframes lt1{0%{opacity:0}30%{opacity:1}60%{opacity:0}}
.lt2{animation:lt2 14s steps(1,end) infinite}@keyframes lt2{0%{opacity:0}60%{opacity:1}95%{opacity:0}}
.mc0{animation:mc0 14s steps(1,end) infinite}@keyframes mc0{0%{opacity:1}36%{opacity:0}95%{opacity:1}}
.mc1{animation:mc1 14s steps(1,end) infinite}@keyframes mc1{0%{opacity:0}36%{opacity:1}64%{opacity:0}}
.mc2{animation:mc2 14s steps(1,end) infinite}@keyframes mc2{0%{opacity:0}64%{opacity:1}95%{opacity:0}}
.bb{transform-box:fill-box;transform-origin:0 50%;animation:bb 14s ease-out infinite}@keyframes bb{0%,30%{transform:scaleX(0)}36%,93%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
.ba{transform-box:fill-box;transform-origin:0 50%;animation:ba 14s ease-out infinite}@keyframes ba{0%,60%{transform:scaleX(0)}68%,93%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
.av{animation:av 14s ease-out infinite}@keyframes av{0%,66%{opacity:0;transform:translate(-6px,0px)}69%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.cp{animation:cp 14s ease-out infinite}@keyframes cp{0%,70%{opacity:0;transform:translate(0px,4px)}73%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="40" y="30" width="720" height="470" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="68" y="70" font-size="18" font-weight="600" fill="#1C2140">LTV calculator</text><text class="f" x="68" y="92" font-size="13" fill="#6B7189">What one customer is really worth to your brand</text>
<rect x="68" y="116" width="148" height="96" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="84" y="142" font-size="12" fill="#6B7189">Order value</text>
<g class="tv0"><text class="f" x="84" y="186" font-size="30" font-weight="600" fill="#1C2140">₹650</text></g>
<text class="f" x="226" y="172" font-size="18" fill="#9AA3C7" text-anchor="middle">×</text>
<rect x="236" y="116" width="148" height="96" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="252" y="142" font-size="12" fill="#6B7189">Orders per year</text>
<text class="f" x="394" y="172" font-size="18" fill="#9AA3C7" text-anchor="middle">×</text>
<rect x="404" y="116" width="148" height="96" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="420" y="142" font-size="12" fill="#6B7189">Years as customer</text>
<g class="tv2"><text class="f" x="420" y="186" font-size="30" font-weight="600" fill="#1C2140">2</text></g>
<text class="f" x="562" y="172" font-size="18" fill="#9AA3C7" text-anchor="middle">×</text>
<rect x="572" y="116" width="148" height="96" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="588" y="142" font-size="12" fill="#6B7189">Gross margin</text>
<g class="tv3"><text class="f" x="588" y="186" font-size="30" font-weight="600" fill="#1C2140">60%</text></g>
<g class="op0" opacity="0"><text class="f" x="252" y="186" font-size="30" font-weight="600" fill="#1C2140">3.2</text></g>
<g class="op1"><text class="f" x="252" y="186" font-size="30" font-weight="600" fill="#1C2140">4.5</text></g>
<g class="hl"><rect x="236" y="116" width="148" height="96" rx="14" fill="none" stroke="#FFC83D" stroke-width="3"/><rect x="302" y="105" width="76" height="22" rx="11" fill="#FFC83D" stroke="#FFFFFF" stroke-width="2"/><text class="f" x="340" y="120" font-size="11" font-weight="600" fill="#1C2140" text-anchor="middle">+ retention</text></g>
<rect x="68" y="232" width="664" height="110" rx="16" fill="#3452FF"/>
<text class="f" x="92" y="266" font-size="13" fill="#DCE3FF">Lifetime value, in gross profit</text><text class="f" x="708" y="266" font-size="13" fill="#DCE3FF" text-anchor="end">Max CAC to stay profitable</text>
<text class="f lt0" x="92" y="318" font-size="40" font-weight="600" fill="#FFFFFF" opacity="0">—</text>
<text class="f lt1" x="92" y="318" font-size="40" font-weight="600" fill="#FFFFFF" opacity="0">₹2,496</text>
<text class="f lt2" x="92" y="318" font-size="40" font-weight="600" fill="#FFFFFF" opacity="1">₹3,510</text>
<text class="f mc0" x="708" y="318" font-size="30" font-weight="600" fill="#FFC83D" text-anchor="end" opacity="0">—</text>
<text class="f mc1" x="708" y="318" font-size="30" font-weight="600" fill="#FFC83D" text-anchor="end" opacity="0">₹832</text>
<text class="f mc2" x="708" y="318" font-size="30" font-weight="600" fill="#FFC83D" text-anchor="end" opacity="1">₹1,170</text>
<text class="f" x="708" y="334" font-size="11" fill="#DCE3FF" text-anchor="end">LTV ÷ 3</text>
<text class="f" x="68" y="382" font-size="13" fill="#6B7189">Per customer</text>
<text class="f" x="68" y="416" font-size="14" fill="#1C2140">Before retention</text><rect x="220" y="405" width="380" height="14" rx="7" fill="#F3F2EE"/><rect class="bb" x="220" y="405" width="270" height="14" rx="7" fill="#AEBBFF"/><text class="f" x="732" y="417" font-size="14" font-weight="600" fill="#1C2140" text-anchor="end">₹2,496</text>
<text class="f" x="68" y="450" font-size="14" fill="#1C2140">After retention</text><rect x="220" y="439" width="380" height="14" rx="7" fill="#F3F2EE"/><rect class="ba" x="220" y="439" width="380" height="14" rx="7" fill="#3452FF"/>
<g class="av"><text class="f" x="732" y="451" font-size="14" font-weight="600" fill="#3452FF" text-anchor="end">₹3,510</text></g>
<g class="cp"><text class="f" x="68" y="482" font-size="13" fill="#6B7189">Retention adds ₹1,014 per customer, so you can bid higher for new buyers and still profit.</text></g>
<style>*{animation-play-state:paused!important;animation-delay:-4s!important}</style></svg>
