<title id="t">Abandoned cart recovery journey</title>
<desc id="d">A phone receives a WhatsApp nudge, an email, an AI assistant call and an SMS coupon while a timeline beside it lights up each recovery step, ending with the order placed and revenue recovered.</desc>
