<style>
:root{--bg:#F4F5F8;--ink:#1B2444;--muted:#6B7189;--accent:#3E4A1A;--chip:#FFFFFF;--line:#E0E2EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2444;--ink:#E6E8EE;--muted:#8E93A1;--accent:#E3FF8C;--chip:#232B4D;--line:#2E375C}}
:root[data-theme="dark"]{--bg:#1B2444;--ink:#E6E8EE;--muted:#8E93A1;--accent:#E3FF8C;--chip:#232B4D;--line:#2E375C}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.tag{position:absolute;left:24px;top:calc(20px + env(safe-area-inset-top,0px));font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.tag b{color:var(--accent);font-weight:600;letter-spacing:.05em;margin-right:10px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);background:var(--chip);border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hint{display:none}}
</style>

scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(3.2,1.1,4.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4;controls.maxDistance=11;
controls.autoRotate=!reduce;controls.autoRotateSpeed=1.4;controls.target.set(0,0,0);
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xE3FF8C,2.2);rim.position.set(-4,2,-3);scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff,.35));
const glow=new THREE.PointLight(0xFFB347,3,3);glow.position.set(0,-1.6,0);scene.add(glow);
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
// star field
const N=260,pos=new Float32Array(N*3),spd=new Float32Array(N);
for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*10;pos[i*3+1]=(Math.random()-.5)*10;pos[i*3+2]=(Math.random()-.5)*6-1.5;spd[i]=.6+Math.random()*1.6}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const sm=new THREE.PointsMaterial({size:.035,transparent:true,opacity:.8,color:new THREE.Color(cssVar('--accent')||'#E3FF8C')});
const stars=new THREE.Points(sg,sm);scene.add(stars);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>sm.color.set(cssVar('--accent')));
const group=new THREE.Group();group.rotation.z=-0.18;scene.add(group);
let flames=[];
const bytes=Uint8Array.from(atob(GLB),c=>c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer,'',g=>{
  group.add(g.scene);
  g.scene.traverse(o=>{if(o.isMesh){if(o.name.startsWith('flame')){o.material.toneMapped=false;flames.push(o)}o.material.envMapIntensity=.55}});
  document.getElementById('load').remove();
},e=>{document.getElementById('load').textContent='Could not load the model'});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.setLength(w<600?8:6.6);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
  if(!reduce){
    group.position.y=Math.sin(t*1.6)*.08;
    for(const f of flames){f.scale.y=1+Math.sin(t*28+f.id)*.08+Math.random()*.06}
    const p=sg.attributes.position.array;
    for(let i=0;i<N;i++){p[i*3+1]-=spd[i]*.016;if(p[i*3+1]<-5)p[i*3+1]=5}
    sg.attributes.position.needsUpdate=true;
    glow.intensity=2.6+Math.random()*.8;
  }
  controls.update();renderer.render(scene,camera);
});
</script>
</body>
</html>
