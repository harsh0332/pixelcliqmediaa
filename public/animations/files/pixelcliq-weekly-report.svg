<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Weekly growth report</title>
<desc id="d">A weekly report card slides in. Revenue, MER, new customer CAC and repeat rate tiles appear with their weekly change, a revenue trend line draws, and next week's planned actions are listed.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.doc{animation:doc 12s cubic-bezier(.2,.8,.2,1) infinite}@keyframes doc{0%{opacity:0;transform:translateY(24px)}5%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
.tl0{animation:tl0 12s ease-out infinite}@keyframes tl0{0%,8%{opacity:0;transform:translate(0px,8px)}11%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.tl1{animation:tl1 12s ease-out infinite}@keyframes tl1{0%,13%{opacity:0;transform:translate(0px,8px)}16%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.tl2{animation:tl2 12s ease-out infinite}@keyframes tl2{0%,18%{opacity:0;transform:translate(0px,8px)}21%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.tl3{animation:tl3 12s ease-out infinite}@keyframes tl3{0%,23%{opacity:0;transform:translate(0px,8px)}26%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.rl{stroke-dasharray:500;animation:rl 12s ease-in-out infinite}@keyframes rl{0%,28%{stroke-dashoffset:500}44%,93%{stroke-dashoffset:0;opacity:1}97%,100%{opacity:0;stroke-dashoffset:0}}
.rd{transform-box:fill-box;transform-origin:center;animation:rd 12s ease-out infinite}@keyframes rd{0%,43%{opacity:0;transform:scale(.3)}46%{opacity:1;transform:scale(1.3)}49%,93%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
.nx0{animation:nx0 12s ease-out infinite}@keyframes nx0{0%,52%{opacity:0;transform:translate(-8px,0px)}55%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.nx1{animation:nx1 12s ease-out infinite}@keyframes nx1{0%,60%{opacity:0;transform:translate(-8px,0px)}63%,93%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="164" y="44" width="472" height="470" rx="20" fill="#EEF1FF"/>
<g class="doc">
<rect x="150" y="30" width="500" height="470" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="178" y="72" font-size="18" font-weight="600" fill="#1C2140">Weekly growth report</text><text class="f" x="178" y="94" font-size="13" fill="#6B7189">Week 14, Glow Lab</text>
<rect x="496" y="56" width="126" height="28" rx="14" fill="#E8ECFF"/><text class="f" x="559" y="75" font-size="12" font-weight="600" fill="#2036D8" text-anchor="middle">Every Monday</text>
<g class="tl0"><rect x="178" y="114" width="216" height="78" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="194" y="140" font-size="12" fill="#6B7189">Revenue</text><text class="f" x="194" y="174" font-size="26" font-weight="600" fill="#1C2140">₹8.4L</text><rect x="314" y="156" width="64" height="24" rx="12" fill="#E3F6EC"/><text class="f" x="346" y="173" font-size="12" font-weight="600" fill="#1B7A4B" text-anchor="middle">+18%</text></g>
<g class="tl1"><rect x="406" y="114" width="216" height="78" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="422" y="140" font-size="12" fill="#6B7189">MER</text><text class="f" x="422" y="174" font-size="26" font-weight="600" fill="#1C2140">4.1</text><rect x="542" y="156" width="64" height="24" rx="12" fill="#E3F6EC"/><text class="f" x="574" y="173" font-size="12" font-weight="600" fill="#1B7A4B" text-anchor="middle">+0.6</text></g>
<g class="tl2"><rect x="178" y="204" width="216" height="78" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="194" y="230" font-size="12" fill="#6B7189">New customer CAC</text><text class="f" x="194" y="264" font-size="26" font-weight="600" fill="#1C2140">₹612</text><rect x="314" y="246" width="64" height="24" rx="12" fill="#E3F6EC"/><text class="f" x="346" y="263" font-size="12" font-weight="600" fill="#1B7A4B" text-anchor="middle">−9%</text></g>
<g class="tl3"><rect x="406" y="204" width="216" height="78" rx="14" fill="#FAF9F6" stroke="#EFEDE7"/><text class="f" x="422" y="230" font-size="12" fill="#6B7189">Repeat rate</text><text class="f" x="422" y="264" font-size="26" font-weight="600" fill="#1C2140">31%</text><rect x="542" y="246" width="64" height="24" rx="12" fill="#E3F6EC"/><text class="f" x="574" y="263" font-size="12" font-weight="600" fill="#1B7A4B" text-anchor="middle">+4 pts</text></g>
<text class="f" x="178" y="316" font-size="12" fill="#6B7189">Revenue, last 8 weeks</text>
<line x1="178" y1="392" x2="622" y2="392" stroke="#EFEDE7"/>
<polyline class="rl" points="178,386 242,378 306,382 370,364 434,360 498,344 562,336 622,318" fill="none" stroke="#3452FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="rd" cx="622" cy="318" r="6" fill="#FFC83D" stroke="#1C2140" stroke-width="2"/>
<line x1="178" y1="412" x2="622" y2="412" stroke="#EFEDE7"/><text class="f" x="178" y="438" font-size="13" font-weight="600" fill="#1C2140">Next week</text>
<g class="nx0"><circle cx="186" cy="458" r="8" fill="#3452FF"/><path d="M182.5 458l2.5 2.5 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="202" y="463" font-size="13" fill="#1C2140">Scale the unboxing ad, budget +20%</text></g>
<g class="nx1"><circle cx="186" cy="482" r="8" fill="#3452FF"/><path d="M182.5 482l2.5 2.5 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="202" y="487" font-size="13" fill="#1C2140">Launch the refill flow for day-45 buyers</text></g>
</g>
</svg>
