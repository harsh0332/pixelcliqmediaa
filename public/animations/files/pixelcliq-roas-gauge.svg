<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How we raise ROAS</title>
<desc id="d">A gauge needle climbs from 1.6x to 4.2x ROAS as four levers switch on: winning creatives, bundles that lift order value, a page that converts and WhatsApp retargeting. Revenue on the same 2 lakh ad spend grows from 3.2 lakh to 8.4 lakh.</desc>
