<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Cutting RTO on COD orders</title>
<desc id="d">Orders move from the store through a verification gate. A risky order is stopped at the gate, verified orders reach the customer, and the RTO rate drops from 32 percent to 11 percent.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.bx{animation:bx 8s linear infinite}
.risk{transform-box:fill-box;transform-origin:50% 50%;animation:risk 8s linear infinite;animation-delay:-2s}
.bad{animation:bad 8s ease-out infinite}
.r1{animation:r1 8s ease-out infinite}.r2{animation:r2 8s ease-out infinite}.r3{animation:r3 8s ease-out infinite}
.n1{animation:n1 8s steps(1,end) infinite}.n2{animation:n2 8s steps(1,end) infinite}.n3{animation:n3 8s steps(1,end) infinite}.n4{animation:n4 8s steps(1,end) infinite}
.meter{transform-box:fill-box;transform-origin:0 50%;animation:meter 8s ease-in-out infinite}
@keyframes bx{from{transform:translateX(var(--a))}to{transform:translateX(var(--b))}}
@keyframes risk{0%{opacity:1;transform:translate(-125px,0)}46.6%{opacity:1;transform:translate(108px,0) rotate(0)}50%{opacity:1;transform:translate(108px,8px) rotate(0)}58%{opacity:0;transform:translate(108px,70px) rotate(20deg)}99.9%{opacity:0;transform:translate(-125px,0)}100%{opacity:1;transform:translate(-125px,0)}}
@keyframes bad{0%,20%{opacity:0}23%,34%{opacity:1}38%,100%{opacity:0}}
@keyframes r1{0%,4%{opacity:0;transform:translateX(-8px)}9%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes r2{0%,18%{opacity:0;transform:translateX(-8px)}23%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes r3{0%,32%{opacity:0;transform:translateX(-8px)}37%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes n1{0%{opacity:1}20%{opacity:0}97%{opacity:1}}
@keyframes n2{0%{opacity:0}20%{opacity:1}40%{opacity:0}}
@keyframes n3{0%{opacity:0}40%{opacity:1}60%{opacity:0}}
@keyframes n4{0%{opacity:0}60%{opacity:1}97%{opacity:0}}
@keyframes meter{0%,18%{transform:scaleX(2.96);fill:#F0506E}22%,38%{transform:scaleX(2.22)}42%,58%{transform:scaleX(1.57)}62%,92%{transform:scaleX(1);fill:#3452FF}97%,100%{transform:scaleX(2.96);fill:#F0506E}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="40" y="30" width="410" height="160" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="64" y="68" font-size="16" font-weight="600" fill="#1C2140">How we cut RTO</text>
<g class="r1"><circle cx="74" cy="100" r="10" fill="#3452FF"/><path d="M69 100l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="94" y="105" font-size="14" fill="#1C2140">Address checked before dispatch</text></g>
<g class="r2"><circle cx="74" cy="132" r="10" fill="#3452FF"/><path d="M69 132l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="94" y="137" font-size="14" fill="#1C2140">COD confirmed on WhatsApp</text></g>
<g class="r3"><circle cx="74" cy="164" r="10" fill="#3452FF"/><path d="M69 164l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="94" y="169" font-size="14" fill="#1C2140">Risky pincodes flagged early</text></g>
<rect x="470" y="30" width="290" height="160" rx="20" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="494" y="68" font-size="15" fill="#6B7189">RTO rate</text>
<text class="f n1" x="494" y="130" font-size="46" font-weight="600" fill="#1C2140" opacity="0">32%</text>
<text class="f n2" x="494" y="130" font-size="46" font-weight="600" fill="#1C2140" opacity="0">24%</text>
<text class="f n3" x="494" y="130" font-size="46" font-weight="600" fill="#1C2140" opacity="0">17%</text>
<text class="f n4" x="494" y="130" font-size="46" font-weight="600" fill="#1C2140">11%</text>
<rect x="494" y="152" width="222" height="10" rx="5" fill="#EFEDE7"/>
<rect class="meter" x="494" y="152" width="75" height="10" rx="5" fill="#3452FF"/>
<rect x="150" y="326" width="510" height="6" rx="3" fill="#E4E2DC"/>
<rect x="58" y="270" width="84" height="60" rx="4" fill="#FFFFFF" stroke="#1C2140" stroke-width="1.5"/>
<rect x="50" y="248" width="100" height="24" rx="6" fill="#3452FF"/>
<rect x="66" y="248" width="14" height="24" fill="#FFC83D"/><rect x="94" y="248" width="14" height="24" fill="#FFC83D"/><rect x="122" y="248" width="14" height="24" fill="#FFC83D"/>
<rect x="88" y="298" width="24" height="32" rx="3" fill="#E8ECFF" stroke="#1C2140" stroke-width="1.5"/>
<g class="bx" style="--a:0px;--b:500px"><rect x="150" y="298" width="34" height="28" rx="4" fill="#FFE3A0" stroke="#1C2140" stroke-width="1.5"/><rect x="164" y="298" width="6" height="28" fill="#E0B75A"/></g>
<g class="risk"><rect x="275" y="298" width="34" height="28" rx="4" fill="#FFE3A0" stroke="#1C2140" stroke-width="1.5"/><rect x="289" y="298" width="6" height="28" fill="#E0B75A"/><rect x="296" y="290" width="12" height="12" rx="3" fill="#F0506E"/></g>
<g class="bx" style="--a:-250px;--b:250px;animation-delay:-4s"><rect x="400" y="298" width="34" height="28" rx="4" fill="#FFE3A0" stroke="#1C2140" stroke-width="1.5"/><rect x="414" y="298" width="6" height="28" fill="#E0B75A"/></g>
<g class="bx" style="--a:-375px;--b:125px;animation-delay:-6s"><rect x="525" y="298" width="34" height="28" rx="4" fill="#FFE3A0" stroke="#1C2140" stroke-width="1.5"/><rect x="539" y="298" width="6" height="28" fill="#E0B75A"/></g>
<rect x="376" y="236" width="6" height="94" fill="#1C2140"/><rect x="418" y="236" width="6" height="94" fill="#1C2140"/><rect x="372" y="230" width="56" height="12" rx="4" fill="#1C2140"/>
<circle cx="400" cy="208" r="15" fill="#3452FF"/><path d="M393 208l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<g class="bad" opacity="0"><circle cx="400" cy="208" r="15" fill="#F0506E"/><path d="M394 202l12 12M406 202l-12 12" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/></g>
<path d="M650 282 L705 246 L760 282 Z" fill="#1C2140"/>
<rect x="662" y="282" width="86" height="48" fill="#FFFFFF" stroke="#1C2140" stroke-width="1.5"/>
<rect x="695" y="300" width="20" height="30" fill="#FFC83D"/>
<g class="f" font-size="13" fill="#6B7189" text-anchor="middle"><text x="100" y="360">Your store</text><text x="400" y="360">Order verified</text><text x="705" y="360">Delivered</text></g>
</svg>
