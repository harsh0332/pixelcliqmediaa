const stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dark=()=>getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().toUpperCase()==='#E3FF8C';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.03).texture;

// math shared with the GLB
const R=1.35,A=.28,W=.46;
function frame(th){const c=new THREE.Vector3(R*Math.cos(th),A*Math.sin(2*th),R*Math.sin(th));

 const n=new THREE.Vector3(Math.cos(th),0,Math.sin(th));n.addScaledVector(T,-n.dot(T)).normalize();
 const B=new THREE.Vector3().crossVectors(T,n),phi=1.5*th;
 const u=n.clone().multiplyScalar(Math.cos(phi)).addScaledVector(B,Math.sin(phi));return {c,u}}
const edge=th=>{const f=frame(th);return f.c.addScaledVector(f.u,W/2*1.001)};

const spin=new THREE.Group();rig.add(spin);
// faint edge line
const EP=[];for(let i=0;i<=800;i++)EP.push(edge(i/800*4*Math.PI));
const edgeLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(EP),new THREE.LineBasicMaterial({color:0xE3FF8C,transparent:true,opacity:.22}));
spin.add(edgeLine);
// comet trail

const trail=new THREE.Line(tg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
spin.add(trail);
const head=new THREE.Mesh(new THREE.SphereGeometry(.03,16,16),new THREE.MeshBasicMaterial({color:0xF4FFC8}));spin.add(head);
const lime=new THREE.Color(0xE3FF8C);

const DN=220,dp=new Float32Array(DN*3);for(let i=0;i<DN;i++){const r=2+Math.random()*3,a=Math.random()*6.28;dp[i*3]=Math.cos(a)*r;dp[i*3+1]=(Math.random()-.5)*3;dp[i*3+2]=Math.sin(a)*r}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.012,color:0xffffff,transparent:true,opacity:.35,depthWrite:false}));scene.add(dust);

// labels
const names=['Discover','Strategise','Create','Launch','Refine'];
const labels=names.map((n,i)=>{const d=document.createElement('div');d.className='node';d.textContent=`0${i+1} ${n}`;stage.appendChild(d);return d});
const listItems=[...document.querySelectorAll('.steps li')];
const nodes=[];const nodeTh=names.map((_,k)=>k*4*Math.PI/5);

  g.scene.traverse(o=>{
    if(o.isMesh&&o.name==='compound_loop'){o.material=new THREE.MeshPhysicalMaterial({color:0x8A93AB,metalness:.5,roughness:.32,clearcoat:1,clearcoatRoughness:.1,envMapIntensity:1.15,side:THREE.DoubleSide})}
    if(o.isMesh&&o.name.startsWith('step_')){o.material=new THREE.MeshBasicMaterial({color:0xE3FF8C});nodes.push(o)}
  });
  nodes.sort((a,b)=>a.name.localeCompare(b.name));
  spin.add(g.scene);
},()=>{});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;

addEventListener('resize',resize);resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',resize);
const ptr={x:0,y:0};addEventListener('pointermove',e=>{ptr.x=e.clientX/innerWidth*2-1;ptr.y=e.clientY/innerHeight*2-1});
const clock=new THREE.Clock(),v=new THREE.Vector3(),wp=new THREE.Vector3(),cp=new THREE.Vector3();
let active=-1;

  const t=reduce?6:clock.getElapsedTime();
  spin.rotation.y=reduce?.3:t*.12;
  rig.rotation.x+=((.42+ptr.y*.12)-rig.rotation.x)*.04;rig.rotation.z+=((-.18-ptr.x*.1)-rig.rotation.z)*.04;
  const hs=(t*.55)%(4*Math.PI);
  for(let i=0;i<TN;i++){const p=edge(hs-i*.018);tp[i*3]=p.x;tp[i*3+1]=p.y;tp[i*3+2]=p.z;const f=Math.pow(1-i/TN,1.6)*1.6;tc[i*3]=lime.r*f;tc[i*3+1]=lime.g*f;tc[i*3+2]=lime.b*f}

  // nearest node behind the head
  let cur=0;for(let k=0;k<5;k++){let d=hs-nodeTh[k];if(d>=0&&d<4*Math.PI/5)cur=k}
  if(cur!==active){active=cur;labels.forEach((l,i)=>l.classList.toggle('on',i===cur));listItems.forEach((l,i)=>l.classList.toggle('on',i===cur))}
  camera.getWorldPosition(cp);
  const W2=stage.clientWidth,H2=stage.clientHeight;
  nodes.forEach((n,i)=>{const on=i===cur;const s=on?1.5+Math.sin(t*6)*.12:.8;n.scale.setScalar(s);

    const behind=wp.z<-.35;labels[i].style.opacity=behind?.25:1;
    labels[i].style.transform=`translate(${(v.x*.5+.5)*W2+14}px,${(-v.y*.5+.5)*H2-5}px)`});
