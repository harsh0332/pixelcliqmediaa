<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">AI sales agent on WhatsApp</title>
<desc id="d">A shopper asks a skincare question on WhatsApp. The AI assistant replies, shares a product card, confirms COD and delivery, and the order gets placed. Around the phone, chips list what the agent does.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
