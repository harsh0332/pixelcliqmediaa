<style>
:root{--bg:#F4F5F8;--glow:rgba(52,82,255,.10);--ink:#1B2444;--muted:#6B7189;--accent:#3E4A1A;--chip:rgba(255,255,255,.92);--line:#E0E2EA;--dot:#3452FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2444;--glow:rgba(227,255,140,.10);--ink:#E6E8EE;--muted:#8E93A1;--accent:#E3FF8C;--chip:rgba(35,43,77,.9);--line:#34406B;--dot:#E3FF8C}}
:root[data-theme="dark"]{--bg:#1B2444;--glow:rgba(227,255,140,.10);--ink:#E6E8EE;--muted:#8E93A1;--accent:#E3FF8C;--chip:rgba(35,43,77,.9);--line:#34406B;--dot:#E3FF8C}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:relative;height:100%;width:100%;background:radial-gradient(60% 55% at 50% 58%,var(--glow),transparent 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.tag{position:absolute;left:24px;top:calc(20px + env(safe-area-inset-top,0px));font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;z-index:2}
.tag b{color:var(--accent);font-weight:600;letter-spacing:.05em;margin-right:10px}
.head{position:absolute;left:24px;top:calc(46px + env(safe-area-inset-top,0px));font-size:clamp(20px,3vw,30px);font-weight:600;line-height:1.15;max-width:15ch;z-index:2}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);background:var(--chip);border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap}
.chip{position:absolute;left:0;top:0;pointer-events:none;font-size:13px;font-weight:500;padding:7px 12px 7px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:8px;transition:opacity .25s;will-change:transform;backdrop-filter:blur(6px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot);display:block}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
@media (max-width:560px){.chip{font-size:12px;padding:6px 10px}.head{max-width:12ch}}
</style>
</head>

const stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(34,1,0.1,100);
const target=new THREE.Vector3(0,1.05,0);
camera.position.set(1.2,1.9,5.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(target);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4;controls.maxDistance=10;
controls.minPolarAngle=.6;controls.maxPolarAngle=1.62;controls.autoRotate=!reduce;controls.autoRotateSpeed=.8;
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(3,5,4);scene.add(key);
const rim=new THREE.DirectionalLight(0xE3FF8C,2.4);rim.position.set(-4,3,-4);scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff,.3));
// contact shadow
const cv=document.createElement('canvas');cv.width=cv.height=256;const cx=cv.getContext('2d');
const gr=cx.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=gr;cx.fillRect(0,0,256,256);
const sh=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
sh.rotation.x=-Math.PI/2;sh.position.y=0.002;scene.add(sh);
// sparkles
const N=140,pos=new Float32Array(N*3),ph=new Float32Array(N);
for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=1.3+Math.random()*1.6;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.random()*3;pos[i*3+2]=Math.sin(a)*r;ph[i]=Math.random()*6}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sm=new THREE.PointsMaterial({size:.03,transparent:true,opacity:.7,color:new THREE.Color(cssv('--dot'))});
scene.add(new THREE.Points(sg,sm));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>sm.color.set(cssv('--dot')));
const orbits=[];const chips=[...document.querySelectorAll('.chip')];
const speeds={orbit_star:.32,orbit_heart:.26,orbit_coin:.36,orbit_badge:.22};
const bytes=Uint8Array.from(atob(GLB),c=>c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer,'',g=>{
  scene.add(g.scene);
  g.scene.traverse(o=>{
    if(o.isMesh&&o.name==='bottle_glass'){o.material=new THREE.MeshPhysicalMaterial({color:0xF2FBFF,transmission:.92,thickness:.2,roughness:.06,ior:1.45,transparent:true,envMapIntensity:1.2,specularIntensity:1});o.renderOrder=2}
    if(o.name&&o.name.startsWith('orbit_')){const p=o.position;orbits.push({o,r:Math.hypot(p.x,p.z),a:Math.atan2(p.z,p.x),y:p.y,s:speeds[o.name]||.3,chip:chips.find(c=>c.dataset.for===o.name)})}
  });
  document.getElementById('load').remove();
},()=>{document.getElementById('load').textContent='Could not load the scene'});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;const d=w<600?7.6:5.9;camera.position.sub(target).setLength(d).add(target);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const v=new THREE.Vector3(),cam=new THREE.Vector3(),clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();
  const W=stage.clientWidth,Hh=stage.clientHeight;
  camera.getWorldPosition(cam);const dBottle=cam.distanceTo(target);
  for(const it of orbits){
    const a=it.a+(reduce?0:t*it.s);
    it.o.position.set(Math.cos(a)*it.r,it.y+(reduce?0:Math.sin(t*1.3+it.a)*.07),Math.sin(a)*it.r);
    it.o.lookAt(cam.x,it.o.position.y,cam.z);it.o.rotateY(reduce?0:Math.sin(t*1.1+it.a)*.5);
    if(it.chip){
      it.o.getWorldPosition(v);const dItem=cam.distanceTo(v);v.project(camera);
      const x=(v.x*.5+.5)*W,y=(-v.y*.5+.5)*Hh;
      it.chip.style.transform=`translate(${x+22}px,${y-14}px)`;
      it.chip.style.opacity=dItem>dBottle+.2?'.35':'1';
    }
  }
  if(!reduce){const p=sg.attributes.position.array;for(let i=0;i<N;i++){p[i*3+1]+=.004;if(p[i*3+1]>3)p[i*3+1]=0}sg.attributes.position.needsUpdate=true}
  controls.update();renderer.render(scene,camera);
});
