<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Brand growth rocket</title>
<desc id="d">A rocket flies upward through a night sky while growth milestones like first 100 orders, 10K customers and 1 crore revenue stream past.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.stars{animation:fall 7s linear infinite}
.lines{animation:fall 1.6s linear infinite}
.ms{animation:ms 9s linear infinite}
.rk{animation:bob 2.4s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl .18s steps(2,end) infinite alternate}
.ex{animation:ex 1.2s linear infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(480px)}}
@keyframes ms{from{transform:translateY(var(--a))}to{transform:translateY(var(--b))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fl{from{transform:scaleY(1)}to{transform:scaleY(1.45)}}
@keyframes ex{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),150px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="sky"><rect x="40" y="20" width="720" height="480" rx="28"/></clipPath>
<g id="st"><rect x="92" y="60" width="4" height="4"/><rect x="180" y="150" width="3" height="3"/><rect x="250" y="40" width="5" height="5" fill="#FFC83D"/><rect x="130" y="300" width="3" height="3"/><rect x="300" y="420" width="4" height="4"/><rect x="520" y="70" width="3" height="3"/><rect x="610" y="180" width="5" height="5" fill="#FFC83D"/><rect x="700" y="90" width="4" height="4"/><rect x="560" y="330" width="3" height="3"/><rect x="690" y="410" width="4" height="4"/><rect x="480" y="470" width="3" height="3"/><rect x="220" y="230" width="3" height="3"/><rect x="660" y="260" width="3" height="3"/><rect x="80" y="440" width="5" height="5" fill="#FFC83D"/></g>
<g id="ln"><rect x="160" y="80" width="2" height="60"/><rect x="330" y="260" width="2" height="80"/><rect x="480" y="120" width="2" height="50"/><rect x="620" y="330" width="2" height="70"/><rect x="250" y="400" width="2" height="60"/><rect x="700" y="40" width="2" height="60"/></g></defs>
<rect x="40" y="20" width="720" height="480" rx="28" fill="#1C2140"/>
<g clip-path="url(#sky)">
<g class="stars" fill="#FFFFFF" opacity=".75"><use href="#st"/><use href="#st" y="-480"/></g>
<g class="lines" fill="#FFFFFF" opacity=".12"><use href="#ln"/><use href="#ln" y="-480"/></g>
<g class="ms" style="--a:-160px;--b:400px;animation-delay:-2.571s"><rect x="80" y="120" width="212" height="42" rx="21" fill="#2A3160" stroke="#3A4378"/><rect x="98" y="135" width="12" height="12" fill="#FFC83D"/><text class="f" x="120" y="146" font-size="14" font-weight="500" fill="#FFFFFF">₹1 Cr in revenue</text></g>
<g class="ms" style="--a:-300px;--b:260px;animation-delay:-4.821s"><rect x="518" y="260" width="212" height="42" rx="21" fill="#2A3160" stroke="#3A4378"/><rect x="536" y="275" width="12" height="12" fill="#FFC83D"/><text class="f" x="558" y="286" font-size="14" font-weight="500" fill="#FFFFFF">10K happy customers</text></g>
<g class="ms" style="--a:-440px;--b:120px;animation-delay:-7.071s"><rect x="80" y="400" width="212" height="42" rx="21" fill="#2A3160" stroke="#3A4378"/><rect x="98" y="415" width="12" height="12" fill="#FFC83D"/><text class="f" x="120" y="426" font-size="14" font-weight="500" fill="#FFFFFF">First 100 orders</text></g>
<g><rect class="ex" x="396" y="336" width="8" height="8" fill="#FFC83D" style="--x:-14px"/><rect class="ex" x="394" y="336" width="10" height="10" fill="#FFFFFF" style="--x:10px;animation-delay:-.3s"/><rect class="ex" x="397" y="336" width="6" height="6" fill="#FF9A3D" style="--x:-4px;animation-delay:-.6s"/><rect class="ex" x="395" y="336" width="8" height="8" fill="#FFFFFF" style="--x:16px;animation-delay:-.9s"/></g>
<g class="rk">
<g class="fl"><rect x="388" y="310" width="24" height="16" fill="#FFC83D"/><rect x="394" y="326" width="12" height="12" fill="#FF9A3D"/></g>
<path d="M370 270 L342 318 L370 306 Z" fill="#FFC83D"/><path d="M430 270 L458 318 L430 306 Z" fill="#FFC83D"/>
<path d="M400 160 C428 188 434 232 432 304 L368 304 C366 232 372 188 400 160 Z" fill="#FFFFFF"/>
<rect x="369" y="276" width="62" height="7" fill="#3452FF"/>
<circle cx="400" cy="228" r="16" fill="#3452FF" stroke="#E8ECFF" stroke-width="5"/>
<rect x="382" y="304" width="36" height="9" rx="3" fill="#9AA3C7"/>
</g>
</g>
</svg>
