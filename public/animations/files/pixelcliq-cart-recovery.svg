<g class="p3"><line class="dash" x1="290" y1="372" x2="330" y2="372" stroke="#C9CCD8" stroke-width="1.5"/><rect x="330" y="344" width="200" height="56" rx="28" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/><circle cx="360" cy="372" r="18" fill="#E8ECFF"/><path d="M353 362c2 7 7 12 14 14l3-4-5-3-2 2c-3-1-5-3-6-6l2-2-3-5z" fill="none" stroke="#1C2140" stroke-width="2" stroke-linejoin="round"/><text class="f" x="388" y="369" font-size="14" font-weight="600" fill="#1C2140">AI voice call</text><text class="f" x="388" y="387" font-size="12" fill="#6B7189">Confirms the order</text><line class="dash" x1="530" y1="372" x2="560" y2="330" stroke="#C9CCD8" stroke-width="1.5"/></g>
