<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Abandoned cart recovery across WhatsApp, email and AI calls</title>
<desc id="d">An abandoned cart triggers a WhatsApp nudge, an email reminder and an AI voice call. The cart turns into a placed order and the recovered revenue figure goes up.</desc>
<style>
.f{font-family:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.p1{animation:p1 10s ease-out infinite}.p2{animation:p2 10s ease-out infinite}.p3{animation:p3 10s ease-out infinite}
.dash{stroke-dasharray:4 5}
.s1{animation:s1 10s steps(1,end) infinite}.s2{animation:s2 10s steps(1,end) infinite}
.n1{animation:s1 10s steps(1,end) infinite}.n2{animation:s2 10s steps(1,end) infinite}
.chip{animation:chip 10s ease-out infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 10s ease-out infinite}
@keyframes p1{0%,8%{opacity:0;transform:translateX(-14px)}13%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes p2{0%,21%{opacity:0;transform:translateX(-14px)}26%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes p3{0%,34%{opacity:0;transform:translateX(-14px)}39%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
@keyframes s1{0%{opacity:1}50%{opacity:0}97%{opacity:1}}
@keyframes s2{0%{opacity:0}50%{opacity:1}97%{opacity:0}}
@keyframes chip{0%,52%{opacity:0;transform:translateY(8px)}56%,90%{opacity:1;transform:translateY(0)}95%,100%{opacity:0}}
@keyframes pop{0%,49%{transform:scale(1)}53%{transform:scale(1.08)}57%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="50" y="50" width="240" height="420" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/>
<text class="f" x="74" y="90" font-size="16" font-weight="600" fill="#1C2140">Your cart</text>
<rect x="74" y="110" width="56" height="56" rx="10" fill="#E8ECFF"/><rect x="94" y="120" width="16" height="36" rx="5" fill="#3452FF"/>
<rect x="144" y="118" width="110" height="10" rx="5" fill="#1C2140"/><rect x="144" y="136" width="70" height="8" rx="4" fill="#C9CCD8"/>
<text class="f" x="144" y="162" font-size="14" font-weight="600" fill="#1C2140">₹1,299</text>
<rect x="74" y="186" width="56" height="56" rx="10" fill="#FFF3D1"/><rect x="92" y="200" width="20" height="28" rx="4" fill="#FFC83D"/>
<rect x="144" y="194" width="96" height="10" rx="5" fill="#1C2140"/><rect x="144" y="212" width="60" height="8" rx="4" fill="#C9CCD8"/>
<text class="f" x="144" y="238" font-size="14" font-weight="600" fill="#1C2140">₹649</text>
<line x1="74" y1="268" x2="266" y2="268" stroke="#EFEDE7"/>
<text class="f" x="74" y="298" font-size="14" fill="#6B7189">Total</text>
<text class="f" x="266" y="298" font-size="16" font-weight="600" fill="#1C2140" text-anchor="end">₹1,948</text>
<g class="s1" opacity="0"><text class="f" x="170" y="384" font-size="13" fill="#6B7189" text-anchor="middle">Left 2 hours ago</text><rect x="74" y="400" width="192" height="44" rx="22" fill="#FDE3E7"/><text class="f" x="170" y="427" font-size="15" font-weight="600" fill="#B3203D" text-anchor="middle">Cart abandoned</text></g>
<g class="s2"><text class="f" x="170" y="384" font-size="13" fill="#6B7189" text-anchor="middle">Recovered automatically</text><g class="pop"><rect x="74" y="400" width="192" height="44" rx="22" fill="#3452FF"/><path d="M104 422l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="186" y="427" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Order placed</text></g></g>
<g class="p1"><line class="dash" x1="290" y1="148" x2="330" y2="148" stroke="#C9CCD8" stroke-width="1.5"/><rect x="330" y="120" width="200" height="56" rx="28" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="1.5"/><circle cx="360" cy="148" r="18" fill="#E8ECFF"/><path d="M350 140h20v14h-12l-6 5v-5h-2z" fill="none" stroke="#1C2140" stroke-width="2" stroke-linejoin="round"/><text class="f" x="388" y="145" font-size="14" font-weight="600" fill="#1C2140">WhatsApp nudge</text><text class="f" x="388" y="163" font-size="12" fill="#6B7189">Your cart is waiting</text></g>
